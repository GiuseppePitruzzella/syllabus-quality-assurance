# Tagging rules for the 8 normative-corpus documents.
# Each chunk produced by MarkdownChunker is tagged with criterion_tags
# (C1-C9 + E1-E4) and agent_tags (A1-A4) based on the section_ref of the
# chunk and the rules under section_tags below.
#
# Match semantics:
#   A rule keyed `R` matches any chunk whose section_ref is exactly `R`
#   or starts with `R + "."`. The most-specific (longest-key) rule wins.
#   Rules are evaluated AFTER excluded_sections: an excluded section
#   produces an untagged chunk regardless of any matching rule.
#
# Documents are versioned in this file so the prompt_version recorded in
# EvaluationResult covers the corpus configuration too.
#
# Source: Appendix B of docs/superpowers/plans/2026-05-01-phase5-evaluation.md
# Cross-referenced with the actual section_refs produced by the chunker
# on the 8 corpus files (see backend/app/evaluation/rag/chunker.py).

documents:

  # === lg_unict =========================================================
  # Linee Guida UniCT per la compilazione del Syllabus.
  # Most directly relevant document: each subsection maps almost 1:1 to
  # one or two of the C1-C9 criteria.
  lg_unict:
    document_title: "Linee Guida UniCT per la compilazione del Syllabus"
    document_version: "2.0_settembre_2023"
    source_type: "linea_guida_ateneo"
    document_priority: 2
    excluded_sections: []
    section_tags:
      "1":
        criterion_tags: []
        agent_tags: []
        note: "Premessa: contesto e finalità, non normativa specifica."
      "2":
        criterion_tags: ["C1"]
        agent_tags: ["A1"]
        note: "Indicazioni operative: enumera le sezioni obbligatorie del syllabus."
      "3":
        criterion_tags: ["C2"]
        agent_tags: ["A1"]
        note: "Intro alla guida: contiene il vincolo bilingue 'in italiano e in inglese'."
      "3.1":
        criterion_tags: ["C2", "C3", "C4"]
        agent_tags: ["A1", "A2"]
        note: "Risultati di apprendimento: formulazione, Dublin Descriptors, vincolo bilingue."
      "3.2":
        criterion_tags: ["C5"]
        agent_tags: ["A1"]
        note: "Prerequisiti: distinzione culturali/formali, gradazione."
      "3.3":
        criterion_tags: ["C2", "C7"]
        agent_tags: ["A1", "A3"]
        note: "Contenuti del corso: vincolo bilingue + struttura contenuti."
      "3.4":
        criterion_tags: ["C2", "C6", "C8"]
        agent_tags: ["A1", "A3"]
        note: "Modalità di valutazione: criteri, coerenza con RA, vincolo bilingue."
      "3.5":
        criterion_tags: ["C2", "C6"]
        agent_tags: ["A1", "A3"]
        note: "Esempi domande: supporto a C6, vincolo bilingue esplicito."
      "3.6":
        criterion_tags: ["C1", "C9"]
        agent_tags: ["A1", "A4"]
        note: "Testi: presenza (C1) e cura editoriale dei riferimenti (C9)."
      "3.7":
        criterion_tags: ["C8"]
        agent_tags: ["A3"]
        note: "Svolgimento: metodi didattici e relazione coi RA."
      "3.8":
        criterion_tags: ["C7"]
        agent_tags: ["A3"]
        note: "Programmazione: distribuzione temporale dei contenuti."
      "3.9":
        criterion_tags: []
