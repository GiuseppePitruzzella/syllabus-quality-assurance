        note: "Funzionalità 'Copia da': operativa, non valutativa."
      "Allegato 1":
        criterion_tags: ["C4"]
        agent_tags: ["A2"]
        note: "Allegato Descrittori di Dublino."
      "Allegato 2":
        criterion_tags: ["C6"]
        agent_tags: ["A3"]
        note: "Esempi per l'attribuzione del voto d'esame."

