[project]
name = "syllabus-quality-assurance-backend"
version = "0.1.0"
description = "Backend for Syllabus Quality Assurance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "sse-starlette>=2.0",
    # === Phase 5: RAG ===
    "chromadb>=0.4.20",
    # Google Gen AI SDK (Vertex AI backend). Replaces the deprecated
    # `vertexai.language_models` (embeddings) and `vertexai.generative_-
    # models` (LLM) modules of `google-cloud-aiplatform`, both removed
    # on 2026-06-24. See:
    # https://docs.cloud.google.com/vertex-ai/generative-ai/docs/deprecations/genai-vertexai-sdk
    "google-genai>=1.0.0",
    # ``google.api_core.exceptions.*`` lives here, not in
    # ``google-cloud-aiplatform``. Kept as a direct dependency
    # because the Vertex HTTP backend still propagates
    # ``ResourceExhausted`` / ``ServiceUnavailable`` /
    # ``DeadlineExceeded`` in many transient failure paths, and
    # both client retry policies depend on them as a defensive
    # fallback alongside ``google.genai.errors.ServerError``.
    "google-api-core>=2.0",
    # === Phase 5: Agentic ===
    "langgraph>=0.0.40",
    "langchain-core>=0.1.0",
    # === Phase 5: Logging ===
    "structlog>=24.0.0",
    # === Phase 5: Rate limiting ===
    "aiolimiter>=1.1.0",
    # === Phase 5: CLI ===
    "typer>=0.9.0",
    "rich>=13.0.0",
    # === Phase 5: YAML config (tagging rules) ===
    "pyyaml>=6.0",
    # === Phase 8: multipart upload for the local-document registry ===
    "python-multipart>=0.0.20",
    # === Phase 8.B.1: text extractors for the registry ===
    "pdfplumber>=0.11",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.11",
    # === Phase 8.B.1: synth PDFs for extractor tests ===
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
