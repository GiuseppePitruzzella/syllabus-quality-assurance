[project]
name = "syllabus-quality-assurance-backend"
version = "0.1.0"
description = "Backend for Syllabus Quality Assurance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "sse-starlette>=2.0",
    # === Phase 5: RAG ===
    "chromadb>=0.4.20",
    "google-cloud-aiplatform>=1.40.0",
    # === Phase 5: Agentic ===
    "langgraph>=0.0.40",
    "langchain-core>=0.1.0",
    # === Phase 5: Logging ===
    "structlog>=24.0.0",
    # === Phase 5: Rate limiting ===
    "aiolimiter>=1.1.0",
    # === Phase 5: CLI ===
    "typer>=0.9.0",
    "rich>=13.0.0",
    # === Phase 5: YAML config (tagging rules) ===
    "pyyaml>=6.0",
    # === Phase 8: multipart upload for the local-document registry ===
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
